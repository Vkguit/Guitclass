<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fonotēka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111111;
      --surface: #1a1a1a;
      --surface-2: #222222;
      --line: #2e2e2e;
      --text: #e8e6e1;
      --muted: #9a978f;
      --gold: #c9a45c;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-weight: 300;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    h1, h2 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      line-height: 1.15;
    }

    .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    /* ---------- Navigation ---------- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(17, 17, 17, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .nav .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 68px;
    }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }
    .brand span { color: var(--gold); }

    .menu { display: flex; gap: 4px; list-style: none; }
    .menu a {
      display: block;
      padding: 10px 14px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .menu a:hover { color: var(--gold); }

    .burger {
      display: none;
      width: 40px; height: 40px;
      background: none;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: pointer;
      position: relative;
    }
    .burger span,
    .burger span::before,
    .burger span::after {
      position: absolute;
      left: 50%;
      width: 18px; height: 1px;
      background: var(--text);
      content: "";
      transform: translateX(-50%);
    }
    .burger span { top: 50%; }
    .burger span::before { top: -6px; }
    .burger span::after { top: 6px; }

    /* ---------- Header ---------- */
    .hero { padding: 80px 0 56px; }
    .back {
      display: inline-flex;
      gap: 8px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .back:hover { color: var(--gold); }
    .eyebrow {
      display: block;
      margin-bottom: 16px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
    .hero h1 { font-size: clamp(2.8rem, 7vw, 5rem); }
    .hero p { max-width: 48ch; margin-top: 16px; color: var(--muted); font-size: 1.05rem; }

    /* ---------- Tiles ---------- */
    .tiles {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      padding-bottom: 96px;
    }
    .tile {
      position: relative;
      display: block;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .tile img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) brightness(0.55);
      transform: scale(1.02);
      transition: filter 0.5s, transform 0.6s;
    }
    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10, 10, 10, 0.92) 0%, rgba(10, 10, 10, 0.2) 60%, transparent 100%);
    }
    .tile-body {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 32px;
    }
    .tile-num {
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3em;
    }
    .tile h2 { margin-top: 6px; font-size: clamp(2rem, 4vw, 2.8rem); }
    .tile p { color: var(--muted); font-size: 0.92rem; }
    .tile-arrow {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 52px; height: 52px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 1.2rem;
      transition: background 0.3s, color 0.3s;
    }
    .tile:hover { border-color: #4a4232; }
    .tile:hover img { filter: grayscale(40%) brightness(0.7); transform: scale(1.07); }
    .tile:hover .tile-arrow { background: var(--gold); color: #111; }

    footer {
      padding: 32px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 760px) {
      .burger { display: block; }
      .menu {
        display: none;
        position: absolute;
        top: 68px;
        left: 0; right: 0;
        flex-direction: column;
        padding: 8px 24px 20px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }
      .nav.menu-open .menu { display: flex; }
      .menu a { padding: 14px 0; }

      .tiles { grid-template-columns: 1fr; }
      .tile-body { padding: 24px; }
      .hero { padding: 56px 0 40px; }
    }
  </style>
</head>
<body>

  <nav class="nav" id="nav">
    <div class="wrap">
      <a href="index.html" class="brand">Klasiskā <span>ģitāra</span></a>

      <button class="burger" aria-label="Izvēlne" onclick="toggleMenu()"><span></span></button>

      <ul class="menu">
        <li><a href="jmvs.html">Galvenā</a></li>
        <li><a href="stundas.html">Stundu saraksts</a></li>
        <li><a href="notis.html">Notis</a></li>
        <li><a href="plans.html">Mācību plāns</a></li>
      </ul>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <a href="index.html" class="back">← Sākumlapa</a>
      <span class="eyebrow">Ieraksti</span>
      <h1>Fonotēka</h1>
      <p>Audio un video ieraksti klausīšanai, analīzei un iedvesmai.</p>
    </div>
  </header>

  <main class="wrap">
    <div class="tiles">
      <a href="audio.html" class="tile">
        <img src="speakers.jpg" alt="">
        <div class="tile-body">
          <div>
            <span class="tile-num">01</span>
            <h2>Audio</h2>
            <p>Audioieraksti</p>
          </div>
          <span class="tile-arrow">→</span>
        </div>
      </a>

      <a href="videoieraksti.php" class="tile">
        <img src="youtub.png" alt="">
        <div class="tile-body">
          <div>
            <span class="tile-num">02</span>
            <h2>Video</h2>
            <p>Videoieraksti</p>
          </div>
          <span class="tile-arrow">→</span>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <div class="wrap">© klasiska-gitara.org</div>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById("nav").classList.toggle("menu-open");
    }
  </script>

</body>
</html>
